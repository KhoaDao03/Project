# Elly Research Assistant — project configuration
#
# Runtime dependencies are intentionally stdlib-only. The application runs on
# Python 3.11+ with optional provider integrations configured at the composition
# boundary.
#
# RUNTIME DEPENDENCIES: none. The application runs on the Python 3.11+ standard
# library only (dataclasses, sqlite3, tomllib, logging, argparse, unicodedata).
# This keeps the core offline, reviewable, and free of unnecessary supply-chain
# surface. Provider adapters remain optional runtime integrations.
#
# DEV dependencies are OPTIONAL. Tests are written with the stdlib `unittest`
# framework and run with zero installs: `PYTHONPATH=src python -m unittest`.
# The [dev] extra pins optional linting, type-checking, and test tooling.

[project]
name = "elly"
version = "0.0.1"
description = "Elly Research Assistant — local-first personal AI assistant prototype."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.6,<1", "mypy>=1.11,<3"]

[project.scripts]
elly = "elly.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
