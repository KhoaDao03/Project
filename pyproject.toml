# Elly Research Assistant — project configuration
#
# Version 1 local prototype configuration.
# Status: M0–M2 closed; M3–M6 reopened by independent verification; M7 open.
#
# RUNTIME DEPENDENCIES: none. The M1 skeleton runs on the Python 3.11+ standard
# library only (dataclasses, sqlite3, tomllib, logging, argparse, unicodedata).
# This is deliberate: it keeps the skeleton offline, reviewable, and free of the
# supply-chain surface that SEC-004/SEC-007 care about. Real providers (Ollama,
# OpenAI, Brave) and their SDKs arrive in later milestones (M2/M4/M5), not here.
#
# DEV dependencies are OPTIONAL. Tests are written with the stdlib `unittest`
# framework and run with zero installs:  PYTHONPATH=src python -m unittest
# The [dev] extra only pins the formatter/linter/type-checker/pytest that the
# team may choose to install later; nothing in M1 requires them.

[project]
name = "elly"
version = "0.0.1"
description = "Elly Research Assistant — local-first personal AI assistant prototype."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.6,<1", "mypy>=1.11,<3"]

[project.scripts]
elly = "elly.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
