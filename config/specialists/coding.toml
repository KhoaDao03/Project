[specialist]
id = "coding"
version = "1.0"
description = "Reviews explicitly supplied code without executing it."
role = "coding"
capabilities = ["code_review", "debugging", "design_feedback"]
accepted_inputs = ["text", "context"]
requires_current_data = false
preferred_runtime = "cloud"
risk_level = "low"
estimated_cost = "medium"
timeout_seconds = 60
prompt_version = "coding-v1"
privacy_class = "remote_allowed"
output_limit = 2000
enabled = true
allowed_tools = []
exclusions = ["code_execution", "file_write", "tool_execution"]

[routing]
priority = 60

[[routing.operations]]
id = "specialist.analyze"
description = "Review, debug, refactor, or improve explicitly supplied source code"
domains = ["code_review", "debugging", "design_feedback"]
accepted_inputs = ["text", "context"]
required_entities = ["subject"]
freshness = "static"
specificity = 70
examples = ["Review this Python function for a bug"]
counterexamples = ["Run this code"]
