[specialist]
id = "coding"
version = "1.0"
description = "Reviews explicitly supplied code without executing it."
role = "coding"
capabilities = ["code_review", "debugging", "design_feedback"]
accepted_inputs = ["text", "context"]
requires_current_data = false
preferred_runtime = "cloud"
risk_level = "low"
estimated_cost = "medium"
timeout_seconds = 60
prompt_version = "coding-v1"
privacy_class = "remote_allowed"
output_limit = 2000
enabled = true
allowed_tools = []
exclusions = ["code_execution", "file_write", "tool_execution"]
