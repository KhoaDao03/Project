# Elly — development configuration (M2 real local generalist).
#
# Copy to `config.local.toml` (gitignored) and adjust locally.
# Load order (see src/elly/config.py): built-in defaults -> this TOML -> ELLY_* env vars.
#
# M2 uses only local Ollama. Do not add API keys here — secrets belong in the
# OS/environment mechanism only (SEC-004).

[app]
name = "elly"
# Where the SQLite database lives. Relative paths resolve against the working
# directory; keep it under a gitignored location. ":memory:" is used by tests.
db_path = "data/elly.db"

[limits]
# FR-001 / NFR-001 boundary: input larger than this is rejected before any model
# call. Provisional default from DESIGN §7 (subject to OQ-05 / M0 confirmation).
max_input_chars = 20000
# FR-002 / AI-006 (initial): how many recent in-session messages the context
# builder may consider. Provisional M1 value; real budgeting lands in M4.
context_window_messages = 20

[generalist]
provider = "ollama"
# qwen3:8b is the development/testing default. qwen3:14b is opt-in only.
model_id = "qwen3:8b"
base_url = "http://127.0.0.1:11434"
timeout_seconds = 120
max_output_tokens = 512

[specialists]
manifest_dir = "config/specialists"

[log]
# Structured-log level. Logs are redacted (SEC-007): no message bodies, secrets,
# or chain-of-thought are ever written.
level = "INFO"
